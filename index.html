<html lang="id"><head><meta charset="utf-8">

<meta name="description" content="CBT Angket Kepuasan Layanan Bimbingan dan Konseling (BK) SMAS Dharma Bakti Damparan TA 2026/2027">
<meta name="theme-color" content="#9a6a1f">

<title>CBT Angket BK – SMAS Dharma Bakti Damparan</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--tx:#1d1b16;--mut:#6b665a;--pri:#9a6a1f;--pri2:#7a1f1f;--bd:#e3dccb;--ok:#1f7a4a;--bad:#b3261e;--fs:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120e;--card:#1f1c16;--tx:#f1ece0;--mut:#a8a190;--pri:#e0a74a;--pri2:#e06b6b;--bd:#3a352a}}
:root[data-theme="dark"]{--bg:#14120e;--card:#1f1c16;--tx:#f1ece0;--mut:#a8a190;--pri:#e0a74a;--pri2:#e06b6b;--bd:#3a352a}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{min-height:100%;display:flex;flex-direction:column}
#clk,#bat{display:none}.ex #clk,.ex #bat{display:inline}.top .row{margin-left:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--bd);gap:8px;flex-wrap:wrap}
.main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:18px 16px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
h1{font-size:1.3em;margin:.4em 0;color:var(--pri2);text-align:center}h2{font-size:1.1em;color:var(--pri);margin:.2em 0 .6em}
.logo{display:block;width:150px;max-width:40%;margin:0 auto}
.c{text-align:center}.mut{color:var(--mut);font-size:.88em}
label{display:block;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=password],textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 16px;border-radius:12px}
button.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:20}
.nav button{flex:1;max-width:220px}
footer{text-align:center;padding:14px 12px calc(92px + env(safe-area-inset-bottom,0px));width:100%}
.timer{font-size:2.2em;font-weight:800;text-align:center;color:var(--pri2);font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.opt{padding:12px;text-align:left}.opt.sel{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid button{padding:10px 0}.g-done{background:var(--ok)!important;color:#fff}.g-doubt{background:#e0a000!important;color:#000}.g-cur{outline:3px solid var(--pri2)}.g-lock{opacity:.4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.modal.on{display:flex}
.modal .card{max-width:420px;width:100%;max-height:85vh;overflow:auto}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;display:none;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.shield{position:fixed;inset:0;background:#000;z-index:90;display:none}
.vio{background:var(--bad);color:#fff;border-radius:16px;padding:20px;text-align:center}
#res{background:#fff;color:#1d1b16;padding:26px;width:100%;border:2px solid #9a6a1f;border-radius:14px;-webkit-user-select:text;user-select:text}
#res table{width:100%;border-collapse:collapse;font-size:13px}#res td,#res th{border:1px solid #e3dccb;padding:5px 7px;text-align:left}#res th{background:#f4ead2}
.bar{height:10px;border-radius:6px;background:#eee;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9a6a1f,#7a1f1f)}
@media print{body{display:none}}
.rs{background:#fff;color:#1d1b16;padding:22px;border:2px solid #9a6a1f;border-radius:14px;font:14px/1.45 system-ui,sans-serif;-webkit-user-select:text;user-select:text}.rs table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}.rs td,.rs th{border:1px solid #e3dccb;padding:5px 7px;text-align:left;vertical-align:top}.rs th{background:#f4ead2}.rs h3{font-size:13px;color:#7a1f1f;margin:14px 0 4px}.rs .bar{height:12px;border-radius:6px;background:#eee;overflow:hidden}.rs .bar i{display:block;height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) img[src^="data:image/png"]{background:radial-gradient(circle at 50% 46%,#fff 60%,transparent 61%)}:root:not([data-theme="light"]) .rs img{background:none}}:root[data-theme="dark"] img[src^="data:image/png"]{background:radial-gradient(circle at 50% 46%,#fff 60%,transparent 61%)}:root[data-theme="dark"] .rs img{background:none}
*{-webkit-tap-highlight-color:transparent}button{touch-action:manipulation}input,textarea{font-size:max(16px,1em)!important}html{-webkit-text-size-adjust:100%}.timer{cursor:pointer;padding:2px 8px}
@keyframes bl{50%{background:#6b0b06}}.vio{animation:bl .7s infinite}.vio h1{font-size:1.15em}
@media(max-width:400px){.opts{grid-template-columns:1fr}.nav{gap:5px;padding-left:6px;padding-right:6px}.nav button{padding:9px 4px;font-size:12.5px}.main{padding:12px 10px 90px}.card{padding:14px}.logo{width:110px}}
@media(max-height:480px){.main{padding-bottom:70px}}
.opts4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.opts4 .opt{text-align:center;padding:12px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}.opts4 .ck{font-size:1.7em;line-height:1}.legend{font-size:.8em;color:var(--mut);margin-top:10px}
.cr{display:block;max-width:100%;margin:0 auto;font-size:clamp(11px,3.1vw,13.5px);line-height:1.6;font-weight:600;overflow-wrap:anywhere;word-break:normal;color:#9a6a1f}
.cr .cr1{letter-spacing:.5px;text-transform:uppercase;font-size:.85em}
.cr .cr2{font-size:1.12em;letter-spacing:.3px}
@supports (-webkit-background-clip:text) or (background-clip:text){.cr{background:linear-gradient(90deg,#c98a1b,#e0452f,#9b2fb5,#2f7be0,#1fa56a,#c98a1b);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:crs 6s linear infinite;filter:drop-shadow(0 0 5px rgba(224,167,74,.55))}}
@keyframes crs{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){.cr{animation:none!important}}
.doa{background:var(--bg);border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:10px;padding:10px 14px;margin:8px 0}.doa p{margin:.4em 0}.ck2{display:flex;align-items:flex-start;gap:10px;margin-top:14px}.ck2 input{width:22px;height:22px;flex:none;margin:0}html,body{overflow-x:hidden}.main{overflow-wrap:anywhere}
</style></head>

 if(out&&Array.isArray(out.nilai)&&out.nilai.length===5&&out.nilai.every(x=>typeof x==="number"&&x>=0&&x<=100)&&S.step===6){S.ai={n:out.nilai,c:Array.isArray(out.catatan)?out.catatan.map(String):[]};buildRes();const e=document.querySelector(".rs");if(e)e.innerHTML=S.res}}catch(e){}}
